name = "ba"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# 网站地址。llmat.dev 必须是同一个 Cloudflare 账号下的域名。
routes = [{ pattern = "ba.llmat.dev", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ba-files"

[[d1_databases]]
binding = "DB"
database_name = "ba-db"
# ba-db 的 id（部署流程会核对它和账号里的一致）
database_id = "d6bf17a9-b0f3-4dd1-80b2-1bba2d6a5ee1"
migrations_dir = "migrations"

# 口令用 `wrangler secret put ACCESS_TOKEN` 设置，本地开发写在 .dev.vars

# AI 报告用的模型：Azure AI Foundry 上的部署。key 是 secret AI_API_KEY（部署流程从仓库的 AI_API_KEY 或
# AZURE_API_KEY 写进来）。能选哪些模型见 src/index.ts 的 DEFAULT_MODELS（或用 AI_MODELS 覆盖）。
[vars]
AI_ENDPOINT_ANTHROPIC = "https://happy-badminton-jay-main-1.services.ai.azure.com/anthropic"
AI_ENDPOINT_OPENAI = "https://happy-badminton-jay-main-1.openai.azure.com/openai/v1"
